[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbom-sleuth"
version = "1.0.0"
description = "Offline quality checks for CycloneDX and SPDX JSON SBOMs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sbom-sleuth = "sbom_sleuth:main"

[tool.setuptools]
py-modules = ["sbom_sleuth"]
